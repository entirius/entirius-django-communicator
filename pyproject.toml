
[project]
name = "entirius-django-communicator"
version = "0.1.0"
description = "Channel-agnostic communication for the Volkanos platform: templates, review, sequences, send policy and inbound replies"
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
test = ["pytest", "pytest-django", "psycopg[binary]>=3.1", "dj-database-url>=2.0"]

[project.urls]
Repository = "https://github.com/entirius/entirius-django-communicator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_communicator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105"]

[tool.ruff.lint.isort]
known-first-party = ["django_communicator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
