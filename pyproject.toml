
[project]
name = "entirius-django-communicator"
version = "0.3.0"
description = "Channel-agnostic communication for Entirius: templates, review, sequences, send policy and inbound replies"
keywords = ["django", "email", "messaging", "outreach", "templates", "celery", "ecommerce", "entirius"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
authors = [{ name = "Entirius" }]
maintainers = [
    { name = "Piotr Brzozowski", email = "piotrb@entirius.com" },
    { name = "Paweł Kiełt", email = "cptshooter12@gmail.com" },
    { name = "Mateusz Baran", email = "mateuszbaranpv@gmail.com" },
    { name = "Michał Kloczkowski", email = "michal@kloczkowski.pl" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
dependencies = [
    "Django>=4.2",
    "djangorestframework>=3.14",
    "djangorestframework-simplejwt>=5.3",
    "drf-spectacular>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",
    "entirius-django-utils>=2.2.0",
    "entirius-django-regional>=2.0.1",
    "entirius-py-idx-normalizator>=2.0.0",
    "entirius-django-email>=4.0.1",
    "celery>=5.3",
    "celery-once>=3.0.1",
    "redis>=5.0",
    "holidays>=0.50",
    "cryptography>=42",
    "nh3>=0.3",
]

[project.optional-dependencies]
dev  = ["ruff", "pre-commit"]
# Soft dependency: toolbox failures raise a notification only when django_notifications is installed.
notifications = ["entirius-django-notifications>=0.1.0"]
test = [
    "pytest",
    "pytest-django",
    "factory-boy",
    "respx",
    "psycopg[binary]>=3.1",
    "dj-database-url>=2.0",
    "entirius-django-notifications>=0.1.0",
    "fakeredis>=2.20",
]

[project.urls]
Homepage = "https://docs.entirius.com/"
Documentation = "https://github.com/entirius/entirius-django-communicator/tree/develop/docs"
Repository = "https://github.com/entirius/entirius-django-communicator"
Changelog = "https://github.com/entirius/entirius-django-communicator/blob/develop/CHANGELOG.md"
Issues = "https://github.com/entirius/entirius-django-communicator/issues"

# utils 2.1.0 (toolbox client) and notifications are not on PyPI until their pre-releases — resolve the sibling clones.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_communicator"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "DJ", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S105", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["django_communicator"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.deptry]
pep621_dev_dependency_groups = ["dev", "test"]
