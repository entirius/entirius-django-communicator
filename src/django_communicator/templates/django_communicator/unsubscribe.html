<!doctype html>
<html lang="{{ t.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{ t.title }}</title>
  <style>body{font-family:sans-serif;max-width:32rem;margin:3rem auto;padding:0 1rem;line-height:1.5}</style>
</head>
<body>
  <h1>{{ t.title }}</h1>
  {% if state == "ask" %}
    <p>{{ t.ask }} <b>{{ email }}</b>?</p>
    <form method="post"><button type="submit">{{ t.button }}</button></form>
  {% elif state == "done" %}
    <p>{{ t.done }} <b>{{ email }}</b>.</p>
  {% else %}
    <p>{{ t.invalid }}</p>
  {% endif %}
</body>
</html>
