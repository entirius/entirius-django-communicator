# ERD configuration for django-communicator — consumed by the ERD tooling (skill entirius-backend:erd-verify).
app_label: django_communicator
groups:
  - name: templates
    title: "Channels & Templates"
    models:
      - Channel
      - MessageTemplate
      - MessageTemplateVersion
  - name: messages
    title: "Threads, Messages & Suppressions"
    models:
      - Channel
      - Thread
      - Message
      - MessageTemplateVersion
      - Suppression
  - name: sending
    title: "Send Policy & Sequences"
    models:
      - Channel
      - SendPolicy
      - SendWindow
      - Sequence
      - SequenceStep
      - TextPool
      - Thread
      - ThreadPoolUsage
      - ThreadSequenceState
  - name: inbound
    title: "Inbound Replies & Mailbox"
    models:
      - Channel
      - MailboxConfig
      - Thread
      - Message
      - Reply
