components:
  schemas:
    ActionEnum:
      enum:
      - approve
      - reject
      type: string
    ApprovalCountsResponse:
      properties:
        total:
          description: Drafts matching the filters.
          examples:
          - 12
          title: Total
          type: integer
        by_channel:
          additionalProperties:
            type: integer
          description: Per channel idx.
          examples:
          - {}
          title: By Channel
          type: object
        by_route:
          additionalProperties:
            type: integer
          description: Per effective route key; empty key = none.
          examples:
          - {}
          title: By Route
          type: object
      required:
      - total
      - by_channel
      - by_route
      title: ApprovalCountsResponse
      type: object
    ApprovalListResponse:
      properties:
        count:
          description: Total matching drafts.
          examples:
          - 1
          title: Count
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: Next page URL.
          examples:
          - null
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          description: Previous page URL.
          examples:
          - null
          title: Previous
        counts:
          $ref: '#/components/schemas/ApprovalCountsResponse'
          description: Totals for the filter chips (whole filtered set).
        results:
          description: Oldest first.
          examples:
          - []
          items:
            $ref: '#/components/schemas/ApprovalRowResponse'
          title: Results
          type: array
      required:
      - count
      - next
      - previous
      - counts
      - results
      title: ApprovalListResponse
      type: object
    ApprovalRowResponse:
      properties:
        id:
          description: Message id.
          examples:
          - 11
          title: Id
          type: integer
        channel:
          description: Channel idx.
          examples:
          - default-europe
          title: Channel
          type: string
        thread_id:
          description: Thread id.
          examples:
          - 3
          title: Thread Id
          type: integer
        sender_route:
          description: Effective route key; empty = none.
          examples:
          - ecomhouse
          title: Sender Route
          type: string
        sender_from:
          description: Mailbox the mail will leave from; empty = the channel's own.
          examples:
          - ''
          title: Sender From
          type: string
        sender_cc:
          description: Copy mailbox.
          examples:
          - ''
          title: Sender Cc
          type: string
        company:
          description: '`company_name` of the caller''s context, else the recipient name.'
          examples:
          - Shop
          title: Company
          type: string
        subject_ref:
          description: Opaque reference of the caller.
          examples:
          - leads.Company:42
          title: Subject Ref
          type: string
        recipient_email:
          description: Recipient.
          examples:
          - jan@shop.test
          title: Recipient Email
          type: string
        template_key:
          description: Template key; empty without a template.
          examples:
          - lead.cold.shop
          title: Template Key
          type: string
        template_version:
          anyOf:
          - type: integer
          - type: 'null'
          description: Template version number.
          examples:
          - 2
          title: Template Version
        subject:
          description: Subject.
          examples:
          - Quick question
          title: Subject
          type: string
        body_preview:
          description: First 300 characters of the body.
          examples:
          - Hello
          title: Body Preview
          type: string
        version:
          description: Version in the rewrite chain.
          examples:
          - 1
          title: Version
          type: integer
        created_at:
          description: Created.
          examples:
          - '2026-09-13T12:00:00Z'
          format: date-time
          title: Created At
          type: string
        age_hours:
          description: Hours waiting.
          examples:
          - 3.5
          title: Age Hours
          type: number
        blocker:
          description: Why approving would be refused (legal footer, route); empty = can approve.
          examples:
          - ''
          title: Blocker
          type: string
      required:
      - id
      - channel
      - thread_id
      - sender_route
      - sender_from
      - sender_cc
      - company
      - subject_ref
      - recipient_email
      - template_key
      - template_version
      - subject
      - body_preview
      - version
      - created_at
      - age_hours
      - blocker
      title: ApprovalRowResponse
      type: object
    BulkApprovalLogListResponse:
      properties:
        count:
          description: Total entries.
          examples:
          - 1
          title: Count
          type: integer
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: Next page URL.
          examples:
          - null
          title: Next
        previous:
          anyOf:
          - type: string
          - type: 'null'
          description: Previous page URL.
          examples:
          - null
          title: Previous
        results:
          description: Newest first.
          examples:
          - []
          items:
            $ref: '#/components/schemas/BulkApprovalLogResponse'
          title: Results
          type: array
      required:
      - count
      - next
      - previous
      - results
      title: BulkApprovalLogListResponse
      type: object
    BulkApprovalLogResponse:
      properties:
        id:
          description: Log entry id.
