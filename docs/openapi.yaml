        remind_after_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: Reminder after this many days.
          examples:
          - 30
          title: Remind After Days
        needs_review:
          description: Flag for a person to read.
          examples:
          - false
          title: Needs Review
          type: boolean
        min_confidence:
          anyOf:
          - type: number
          - type: 'null'
          description: Own threshold; null = module setting.
          examples:
          - null
          title: Min Confidence
        auto_suppress:
