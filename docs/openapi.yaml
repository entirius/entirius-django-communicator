openapi: 3.1.0
info:
  title: entirius-django-communicator Admin API v2
  version: 0.1.0
  description: Templates, review, sending, sequences and inbound replies of one communicator channel.
paths:
  /api/communicator/v2/admin/{channel_idx}/channel/:
    get:
      operationId: communicator_v2_admin_channel_retrieve
      summary: Channel sending mode
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Sending
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfigResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: communicator_v2_admin_channel_partial_update
      description: 'live and live_enabled are set in Django admin only: `mode=live` or any `live_enabled` answers 400. sandbox
        without a mailbox answers 409 (C-30). `default_sender_route` picks the channel''s default sender route (empty clears;
        an unknown or inactive route answers 409).'
      summary: Change mode or sandbox mailbox
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Sending
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChannelConfigRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedChannelConfigRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChannelConfigRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelConfigResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/conversations/:
    get:
      operationId: communicator_conversations_list
      summary: Conversations of the channel (one row per subject reference), latest activity first
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: state
        schema:
          type: string
          enum:
          - draft
          - replied
          - waiting
        description: Inbox filter.
      tags:
      - Communicator Inbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/footers/:
    get:
      operationId: communicator_footers_list
      summary: Mail footers of the channel
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Footers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/footers/{language}/:
    get:
      operationId: communicator_v2_admin_footers_retrieve
      summary: Mail footer in one language
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: language
        schema:
          type: string
        required: true
      tags:
      - Communicator Footers
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    put:
      operationId: communicator_v2_admin_footers_update
      description: The HTML is sanitised to an allowlist (a, img, p, br, strong, em, span, div, table family; basic text,
        colour and size styles) and must keep `{{ legal }}` exactly once, else 400 on `html`. Sent messages keep the footer
        they went out with (`footer_html`).
      summary: Create or replace the mail footer
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: language
        schema:
          type: string
        required: true
      tags:
      - Communicator Footers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FooterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FooterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FooterRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FooterResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: communicator_v2_admin_footers_destroy
      description: Mail in this language falls back to the channel default language's footer, else the legal text alone.
      summary: Remove the mail footer
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: language
        schema:
          type: string
        required: true
      tags:
      - Communicator Footers
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/mailbox/:
    get:
      operationId: communicator_v2_admin_mailbox_retrieve
      summary: IMAP mailbox of the channel
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Inbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    put:
      operationId: communicator_v2_admin_mailbox_update
      description: The password is stored encrypted and never returned; omit it to keep the stored one.
      summary: Create or replace the IMAP mailbox
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailboxRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MailboxRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MailboxRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailboxResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/messages/:
    get:
      operationId: communicator_v2_admin_messages_retrieve
      summary: Outbound messages by status with their next slot
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - approved
          - draft
          - failed
          - rejected
          - review_required
          - scheduled
          - sending
          - sent
          - skipped
          - superseded
          - suppressed
          - would_send
        description: Default approved.
      tags:
      - Communicator Sending
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/messages/{id}/send-now/:
    post:
      operationId: communicator_v2_admin_messages_send_now_create
      description: Sets scheduled_at to the channel clock only; the next beat run still applies mode, policy and cap.
      summary: Send now
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Sending
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/models/:
    get:
      operationId: communicator_v2_admin_models_retrieve
      summary: Toolbox models available for templates
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Templates
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '502':
          description: No response body
        '503':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/policy/:
    get:
      operationId: communicator_v2_admin_policy_retrieve
      summary: Send policy of the channel
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Sending
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
    put:
      operationId: communicator_v2_admin_policy_update
      summary: Create or replace the send policy
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Sending
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PolicyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/replies/:
    get:
      operationId: communicator_replies_list
      summary: Replies of the channel, newest first
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: query
        name: intent
        schema:
          type: string
          enum:
          - interested
          - not_interested
          - not_now
          - out_of_office
          - unclear
          - unsubscribe
          - wrong_person
        description: Only replies of this intent.
      - in: query
        name: kind
        schema:
          type: string
          enum:
          - auto
          - bounce_hard
          - bounce_soft
          - reply
          - suspected_optout
        description: Only replies of this kind.
      - in: query
        name: needs_review
        schema:
          type: boolean
        description: Only replies flagged (true) or not flagged (false).
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: thread
        schema:
          type: integer
        description: Only replies of this thread.
      tags:
      - Communicator Inbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/replies/{id}/confirm-optout/:
    post:
      operationId: communicator_v2_admin_replies_confirm_optout_create
      description: Suppresses the thread recipient, stops the sequence and emits optout_confirmed; any other reply → 409.
      summary: Confirm a suspected opt-out
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Inbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/replies/{id}/dismiss-optout/:
    post:
      operationId: communicator_v2_admin_replies_dismiss_optout_create
      description: The reply becomes a plain reply (no notification); the sequence stays paused until resume-sequence; any
        other → 409.
      summary: Dismiss a suspected opt-out
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Inbox
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/reply-actions/:
    get:
      operationId: communicator_reply_actions_list
      summary: Next step per reply intent class (stored mapping or the safe default)
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      tags:
      - Communicator Reply Actions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyActionListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/reply-actions/{intent}/:
    put:
      operationId: communicator_v2_admin_reply_actions_update
      description: Replaces the whole mapping of the class. `pause_until_return` only for `out_of_office`, `auto_suppress`
        only for `unsubscribe`. Applies to replies that arrive afterwards.
      summary: Set the next step for one intent class
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: intent
        schema:
          type: string
        required: true
      tags:
      - Communicator Reply Actions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyActionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReplyActionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReplyActionRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyActionResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    delete:
      operationId: communicator_v2_admin_reply_actions_destroy
      summary: Back to the default for one intent class
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: intent
        schema:
          type: string
        required: true
      tags:
      - Communicator Reply Actions
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReplyActionResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/:
    get:
      operationId: communicator_review_list
      description: Oldest first, paginated (`page`, `page_size` ≤ 100). Default status `review_required`.
      summary: List messages of the channel by status
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: Page number.
      - in: query
        name: status
        schema:
          type: string
        description: Message status.
      tags:
      - Communicator Review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageListResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/{id}/:
    get:
      operationId: communicator_v2_admin_review_retrieve
      description: Any status; 404 for an unknown id or another channel's message.
      summary: One message of the channel by id
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/{id}/accept/:
    post:
      operationId: communicator_v2_admin_review_accept_create
      summary: Accept a message
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Review
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/{id}/edit/:
    post:
      operationId: communicator_v2_admin_review_edit_create
      description: Creates the next version with `edited_by_human`; no toolbox call.
      summary: Edit a message by hand
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EditRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EditRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/{id}/rewrite/:
    post:
      operationId: communicator_v2_admin_review_rewrite_create
      description: 'Creates the next version through the toolbox; the reviewed one becomes `superseded`. A toolbox failure
        returns a `failed` version and keeps the reviewed message in the queue. 503 `AI_TOOLBOX_DISABLED` while the toolbox
        is switched off: no version is created.'
      summary: Rewrite an AI draft with reviewer notes
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Review
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RewriteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetailResponse'
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          description: No response body
        '503':
          description: No response body
  /api/communicator/v2/admin/{channel_idx}/review/{id}/skip/:
    post:
      operationId: communicator_v2_admin_review_skip_create
      summary: Reject a message
      parameters:
      - in: path
        name: channel_idx
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Communicator Review
