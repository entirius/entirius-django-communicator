components:
  schemas:
    ChannelConfigResponse:
      properties:
        idx:
          description: Channel idx.
          examples:
          - default-europe
          title: Idx
          type: string
        label:
          description: Label.
          examples:
          - Default Europe
          title: Label
          type: string
        mode:
          description: dry_run, sandbox or live.
          examples:
          - sandbox
          title: Mode
          type: string
        sandbox_mailbox:
          description: Sandbox recipient.
          examples:
          - sandbox@mail.test
          title: Sandbox Mailbox
          type: string
        live_enabled:
          description: Live mode allowed.
          examples:
          - false
          title: Live Enabled
          type: boolean
        timezone:
          description: Timezone.
          examples:
          - Europe/Warsaw
          title: Timezone
          type: string
        country:
          description: Holiday country.
          examples:
          - PL
          title: Country
          type: string
      required:
      - idx
      - label
      - mode
      - sandbox_mailbox
      - live_enabled
      - timezone
      - country
      title: ChannelConfigResponse
      type: object
    ChannelMode:
      enum:
      - dry_run
      - sandbox
      - live
      title: ChannelMode
      type: string
    DraftPreviewResponse:
      properties:
        subject:
          description: Generated or rendered subject.
          examples:
          - Quick question
          title: Subject
          type: string
        body_text:
          description: Generated or rendered body.
          examples:
          - Hello, ...
          title: Body Text
          type: string
        rendered_prompt:
          description: Prompt sent (ai_prompt), empty for static.
          examples:
          - ''
          title: Rendered Prompt
          type: string
        model:
          description: Model used.
          examples:
          - fake-chat
          title: Model
          type: string
        usage:
          additionalProperties: true
          description: Usage of the call.
          examples:
          - {}
          title: Usage
          type: object
      required:
      - subject
      - body_text
      - rendered_prompt
      - model
      - usage
      title: DraftPreviewResponse
      type: object
    EditRequest:
      additionalProperties: false
      properties:
        subject:
          description: Edited subject.
          examples:
          - Quick question
          maxLength: 255
          minLength: 1
          title: Subject
          type: string
        body_text:
          description: Edited plain-text body.
          examples:
          - Hello, ...
          minLength: 1
          title: Body Text
          type: string
      required:
      - subject
      - body_text
      title: EditRequest
      type: object
    MailboxRequest:
      additionalProperties: false
      properties:
        imap_host:
          description: IMAP host.
          examples:
          - imap.mail.test
          maxLength: 255
          minLength: 1
          title: Imap Host
          type: string
        imap_port:
          default: 993
          description: IMAP port.
          examples:
          - 993
          maximum: 65535
          minimum: 1
          title: Imap Port
          type: integer
        imap_use_ssl:
          default: true
          description: IMAP over TLS.
          examples:
          - true
          title: Imap Use Ssl
          type: boolean
        imap_user:
          description: IMAP login.
          examples:
          - outreach
          maxLength: 255
          minLength: 1
          title: Imap User
          type: string
        imap_password:
          anyOf:
          - maxLength: 1024
            type: string
          - type: 'null'
          default: null
          description: Write-only; omitted or null keeps the stored one.
          title: Imap Password
        folder:
          default: INBOX
          description: Folder polled.
          examples:
          - INBOX
          maxLength: 64
          minLength: 1
          title: Folder
          type: string
        is_active:
          default: true
          description: Polled by the beat.
          examples:
          - true
          title: Is Active
          type: boolean
      required:
      - imap_host
      - imap_user
      title: MailboxRequest
      type: object
    MailboxResponse:
      properties:
        imap_host:
          description: IMAP host.
          examples:
          - imap.mail.test
          title: Imap Host
          type: string
        imap_port:
          description: IMAP port.
          examples:
          - 993
          title: Imap Port
          type: integer
        imap_use_ssl:
          description: IMAP over TLS.
          examples:
          - true
          title: Imap Use Ssl
          type: boolean
        imap_user:
          description: IMAP login.
          examples:
          - outreach
          title: Imap User
          type: string
        has_password:
          description: A password is stored (never returned).
          examples:
          - true
          title: Has Password
          type: boolean
        folder:
          description: Folder polled.
          examples:
          - INBOX
          title: Folder
          type: string
        last_uid:
          description: Poll cursor.
          examples:
          - 0
          title: Last Uid
          type: integer
        is_active:
          description: Polled by the beat.
          examples:
          - true
          title: Is Active
          type: boolean
        last_polled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Last successful poll.
          examples:
          - null
          title: Last Polled At
      required:
      - imap_host
      - imap_port
      - imap_use_ssl
      - imap_user
      - has_password
      - folder
      - last_uid
      - is_active
      - last_polled_at
      title: MailboxResponse
      type: object
    MessageDetailResponse:
      properties:
        id:
          description: Message id.
          examples:
          - 11
          title: Id
          type: integer
        status:
          description: Message status.
          examples:
          - review_required
          title: Status
          type: string
        direction:
          description: out or in.
          examples:
          - out
          title: Direction
          type: string
        subject:
          description: Subject.
          examples:
          - Quick question
          title: Subject
          type: string
        body_text:
          description: Plain-text body (no footer).
          examples:
          - Hello, ...
          title: Body Text
          type: string
        render_context:
          additionalProperties: true
          description: The caller's context, for the reviewer.
          examples:
          - {}
          title: Render Context
          type: object
        rendered_prompt:
          description: Prompt sent to the toolbox (AI drafts).
          examples:
          - ''
          title: Rendered Prompt
          type: string
        model:
          description: Model that wrote the draft.
          examples:
          - fake-chat
          title: Model
          type: string
        usage:
          additionalProperties: true
          description: input_tokens, output_tokens, cost.
          examples:
          - {}
          title: Usage
          type: object
        attempts:
          description: Toolbox calls made for this version.
          examples:
          - 1
          title: Attempts
          type: integer
        version:
          description: Version in the rewrite chain.
          examples:
          - 1
          title: Version
          type: integer
        parent_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Previous version.
          examples:
          - null
          title: Parent Id
        automated_rewrites:
          description: Automated rewrites in the chain.
          examples:
          - 0
          title: Automated Rewrites
          type: integer
        edited_by_human:
          description: Written by a reviewer.
          examples:
          - false
          title: Edited By Human
          type: boolean
        requires_review:
          description: The caller asked for review.
          examples:
          - true
          title: Requires Review
          type: boolean
        reviewed_by_id:
          anyOf:
          - type: integer
          - type: 'null'
          description: Reviewer user id.
          examples:
          - null
          title: Reviewed By Id
        reviewed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When reviewed.
          examples:
          - null
          title: Reviewed At
        reject_reason:
          description: Why rejected.
          examples:
          - ''
          title: Reject Reason
          type: string
        review_notes:
          description: Notes that produced this version.
          examples:
          - ''
          title: Review Notes
          type: string
        legal_footer:
          description: Footer carried verbatim.
          examples:
          - ''
          title: Legal Footer
          type: string
        scheduled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Send slot; empty = due at once.
          examples:
          - null
          title: Scheduled At
        sent_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: Delivered (sent or would_send) on the channel clock.
          examples:
          - null
          title: Sent At
        message_id:
          description: Our Message-ID header once sent.
          examples:
          - ''
          title: Message Id
          type: string
        send_attempts:
          description: SMTP deliveries tried.
          examples:
          - 0
          title: Send Attempts
          type: integer
        replied_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: A header-matched reply answered it.
          examples:
          - null
          title: Replied At
        failure_code:
          description: no_template, render, budget, schema, model, upstream or smtp.
          examples:
          - ''
          title: Failure Code
          type: string
        failure_detail:
          description: Error class and codes — never the prompt.
          examples:
          - ''
          title: Failure Detail
          type: string
        created_at:
          description: Created.
          examples:
          - '2026-09-13T12:00:00Z'
          format: date-time
          title: Created At
          type: string
        thread:
          $ref: '#/components/schemas/ThreadResponse'
          description: Conversation the message belongs to.
        template:
          anyOf:
          - $ref: '#/components/schemas/TemplateRefResponse'
          - type: 'null'
          description: Template version used; null when none.
      required:
      - id
      - status
      - direction
      - subject
      - body_text
      - render_context
      - rendered_prompt
      - model
      - usage
      - attempts
      - version
      - parent_id
      - automated_rewrites
      - edited_by_human
      - requires_review
      - reviewed_by_id
      - reviewed_at
      - reject_reason
      - review_notes
      - legal_footer
      - scheduled_at
      - sent_at
      - message_id
      - send_attempts
      - replied_at
      - failure_code
      - failure_detail
      - created_at
      - thread
      - template
      title: MessageDetailResponse
      type: object
