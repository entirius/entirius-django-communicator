    ReplyActionRequest:
      additionalProperties: false
      description: The whole next-step mapping of one intent class; omitted fields take the model defaults.
      properties:
        sequence:
          $ref: '#/components/schemas/ReplySequenceAction'
          default: stop
          description: stop (as every reply did before T4), pause, or pause_until_return (out_of_office only).
          examples:
          - pause
        notify:
          $ref: '#/components/schemas/NotifySeverity'
          default: high
          description: Alert severity for the sales admin; none = silent.
          examples:
          - medium
        remind_after_days:
          anyOf:
          - maximum: 365
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          description: 'Alert a person to follow up this many days after the reply (out of office: only when the reply gave
            no return date).'
          examples:
          - 30
          title: Remind After Days
        needs_review:
          default: false
          description: Flag the reply for a person to read.
          examples:
          - false
          title: Needs Review
          type: boolean
        min_confidence:
          anyOf:
          - maximum: 1
            minimum: 0
            type: number
          - type: 'null'
          default: null
          description: Below this confidence the class becomes unclear; null = COMMUNICATOR_REPLY_INTENT_MIN_CONFIDENCE.
          examples:
          - 0.8
          title: Min Confidence
        auto_suppress:
          default: false
          description: 'unsubscribe only: confirm the opt-out (suppression) without a person, like confirm-optout.'
          examples:
          - false
          title: Auto Suppress
          type: boolean
      title: ReplyActionRequest
      type: object
    ReplyActionResponse:
      properties:
